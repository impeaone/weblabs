{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">Проверка номера телефона</h4>
            </div>
            <div class="card-body">
                <form action="/phone-validate" method="POST" id="phoneForm" novalidate>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Номер телефона</label>
                        <input type="text" 
                               class="form-control {% if error_message %}is-invalid{% endif %}" 
                               id="phone" 
                               name="phone" 
                               value="{{ phone_input if phone_input else '' }}"
                               placeholder="+7 (123) 456-75-90 или 8(123)4567590 или 123.456.75.90"
                               required>
                        {% if error_message %}
                            <div class="invalid-feedback">
                                {{ error_message }}
                            </div>
                        {% endif %}
                        <div class="form-text">
                            Допустимые форматы:<br>
                            • +7 (123) 456-75-90<br>
                            • 8(123)4567590<br>
                            • 123.456.75.90
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Проверить</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="mt-3">
            <a href="/" class="btn btn-secondary">На главную</a>
        </div>
    </div>
</div>
{% endblock %}
