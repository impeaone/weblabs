{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0 text-center">Вход в систему</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Имя пользователя</label>
                        <input type="text" 
                               class="form-control" 
                               id="username" 
                               name="username" 
                               placeholder="Введите логин"
                               required
                               autofocus>
                        <div class="form-text">
                            Используйте: <code>user</code>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" 
                               class="form-control" 
                               id="password" 
                               name="password" 
                               placeholder="Введите пароль"
                               required>
                        <div class="form-text">
                            Используйте: <code>qwerty</code>
                        </div>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" 
                               class="form-check-input" 
                               id="remember" 
                               name="remember">
                        <label class="form-check-label" for="remember">
                            Запомнить меня
                        </label>
                        <div class="form-text">
                            При включении этой опсии сессия сохранится после закрытия браузера
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Войти
                        </button>
                    </div>
                </form>
                
                <hr class="my-4">
                
                <div class="alert alert-info">
                    <h6 class="alert-heading">Тестовые данные:</h6>
                    <p class="mb-1"><strong>Логин:</strong> user</p>
                    <p class="mb-0"><strong>Пароль:</strong> qwerty</p>
                </div>
            </div>
            <div class="card-footer text-center">
                <a href="{{ url_for('index') }}" class="text-decoration-none">
                    ← Вернуться на главную
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
